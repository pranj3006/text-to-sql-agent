
networks:
  text-to-sql-network:

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: text-to-sql-postgres
    environment:
    - POSTGRES_USER=<YOUR_POSTGRES_USER>
    - POSTGRES_PASSWORD=<YOUR_POSTGRES_PASSWORD>
    - POSTGRES_DB=<YOUR_POSTGRES_DB>
    - APP_DATABASE_NAME=app_db
    - APP_DATABASE_USER=<YOUR_APP_DATABASE_USER>
    - APP_DATABASE_PASSWORD=<YOUR_APP_DATABASE_PASSWORD>
    - BUSINESS_DATABASE_NAME=business_db
    - BUSINESS_DATABASE_USER=<YOUR_BUSINESS_DATABASE_USER>
    - BUSINESS_DATABASE_PASSWORD=<YOUR_BUSINESS_DATABASE_PASSWORD>
    ports:
      - "5433:5432"
    volumes:
      - ./.postgres_data:/var/lib/postgresql/data
      - ./.database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - text-to-sql-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: text-to-sql-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: <YOUR_PGADMIN_EMAIL>
      PGADMIN_DEFAULT_PASSWORD: <YOUR_PGADMIN_PASSWORD>
    ports:
      - "8087:80"
    depends_on:
      - postgres
    networks:
      - text-to-sql-network
