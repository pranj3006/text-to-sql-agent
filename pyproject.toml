[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pranjal G", email = "pranj3006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.41.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-jose[cryptography]>=3.5.0",
    "python-json-logger>=4.2.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlglot>=30.26.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
text-to-sql-agent = "text_to_sql_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
